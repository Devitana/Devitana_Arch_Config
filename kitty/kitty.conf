# Font
font_family JetBrainsMono Nerd Font
font_size 13.0

# Background matching Waybar
background #1e1e2e
background_opacity 0.5

foreground #ffffff

# Cursor & selection
cursor #ffffff
selection_background #ffffff
selection_foreground #1e1e2e
selection_foreground_opacity 0.1

# Padding to match Waybar’s rounded look
window_padding_width 12
